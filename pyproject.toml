[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aieval"
version = "0.1.0"
description = "Deterministic-first runtime validation and reliability toolkit for LLM outputs and agent actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hamza", email = "hamza@example.com" }
]
keywords = [
    "ai",
    "llm",
    "evaluation",
    "validation",
    "guardrails",
    "agent",
    "pydantic",
    "runtime-safety"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed"
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/hamza1331/aieval-py"
Repository = "https://github.com/hamza1331/aieval-py"
Issues = "https://github.com/hamza1331/aieval-py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0"
]

[project.scripts]
aieval = "aieval.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aieval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501" # line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"

